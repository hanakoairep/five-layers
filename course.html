<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Agent Engineering - your account</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fff;--soft:#f7f7f9;--ink:#0b0b0c;--ink2:#55555e;--mut:#8e8e98;
  --line:#ececed;--line2:#f4f4f6;--vio:#6d4fe0;
  --i1:#c9b8ff;--i2:#ffcdb0;--i3:#a9dcff;--i4:#bff0dc;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:'DM Sans',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.btn{
  position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:9px;
  background:linear-gradient(180deg,#565663 0%,#26262e 34%,#0d0d10 72%,#000 100%);
  color:#fff;font-family:inherit;font-weight:700;font-size:15px;letter-spacing:-.01em;
  padding:14px 26px;border-radius:999px;text-decoration:none;border:none;cursor:pointer;min-height:48px;
  box-shadow:0 1.5px 0 rgba(255,255,255,.5) inset,0 -7px 16px rgba(0,0,0,.5) inset;
  transition:transform .16s,filter .16s;
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
.btn-block{width:100%}
.btn-line{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 2px 8px rgba(11,11,12,.05)}

/* ---------- gate ---------- */
.gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
.field{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(64px);opacity:.8}
.b1{width:60vw;height:60vw;max-width:560px;max-height:560px;left:-10vw;top:-14vh;background:var(--i1)}
.b2{width:54vw;height:54vw;max-width:520px;max-height:520px;right:-10vw;top:-6vh;background:var(--i2)}
.b3{width:50vw;height:50vw;max-width:480px;max-height:480px;left:30vw;top:10vh;background:var(--i3);opacity:.6}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.9) 55%,#fff 80%)}
.gate-card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:26px;padding:32px 26px;box-shadow:0 24px 60px rgba(11,11,12,.08);text-align:center}
.mark{width:38px;height:38px;border-radius:50%;margin:0 auto 18px;background:conic-gradient(from 200deg,var(--i1),var(--i2),var(--i4),var(--i3),var(--i1));display:flex;align-items:center;justify-content:center}
.mark i{width:11px;height:11px;border-radius:50%;background:#fff;display:block}
.gate-card h1{font-size:25px;font-weight:900;letter-spacing:-.04em;line-height:1.1}
.gate-card p{margin-top:12px;color:var(--ink2);font-size:15px;line-height:1.55}
input[type=email]{
  width:100%;margin-top:22px;padding:15px 16px;border:1px solid var(--line);border-radius:14px;
  font-family:inherit;font-size:16px;background:var(--soft);color:var(--ink);
}
input[type=email]:focus{outline:2px solid var(--vio);outline-offset:1px;background:#fff}
.gate-card .btn{margin-top:12px}
.msg{margin-top:16px;font-size:14px;line-height:1.5;display:none}
.msg.show{display:block}
.msg.ok{color:#2f9e6b}
.msg.err{color:#c0472f}
.gate-foot{margin-top:22px;padding-top:18px;border-top:1px solid var(--line2);font-size:13px;color:var(--mut);line-height:1.55}
.gate-foot a{color:var(--ink);font-weight:600}

/* ---------- app ---------- */
.app{display:none}
.app.on{display:block}
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(255,255,255,.86);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.topbar-in{max-width:1180px;margin:0 auto;padding:0 18px;height:60px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:-.03em;font-size:15px;white-space:nowrap}
.bname{display:none}
@media(min-width:420px){.bname{display:inline}}
.bdot{width:22px;height:22px;border-radius:50%;background:conic-gradient(from 200deg,var(--i1),var(--i2),var(--i4),var(--i3),var(--i1))}
.who{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw;display:none}
@media(min-width:560px){.who{display:block}}
.lo{background:none;border:none;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer;padding:8px 10px;border-radius:999px;white-space:nowrap;margin-left:auto}
@media(min-width:560px){.lo{margin-left:0}}
.lo:hover{background:var(--soft)}
.menu-btn{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer}
.menu-btn span{display:block;width:16px;height:2px;background:var(--ink);position:relative}
.menu-btn span:before,.menu-btn span:after{content:"";position:absolute;left:0;width:16px;height:2px;background:var(--ink)}
.menu-btn span:before{top:-5px}.menu-btn span:after{top:5px}
@media(min-width:960px){.menu-btn{display:none}}

.shell{max-width:1180px;margin:0 auto;padding:0 18px;display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:960px){.shell{grid-template-columns:264px 1fr;gap:44px;padding:0 32px}}

/* sidebar */
.side{
  position:fixed;inset:60px 0 0 0;z-index:35;background:#fff;padding:20px 18px 40px;
  overflow-y:auto;transform:translateX(-102%);transition:transform .26s ease;
}
.side.open{transform:translateX(0)}
@media(min-width:960px){
  .side{position:sticky;top:60px;inset:auto;transform:none;height:calc(100dvh - 60px);padding:28px 0 60px;overflow-y:auto}
}
.side-h{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:0 0 12px 6px}
.lay{margin-bottom:20px}
.lay-t{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:800;letter-spacing:-.02em;padding:0 6px 8px}
.lay-t i{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.les{display:block;width:100%;text-align:left;background:none;border:none;font-family:inherit;
  font-size:14.5px;color:var(--ink2);padding:9px 12px;border-radius:10px;cursor:pointer;line-height:1.35}
.les:hover{background:var(--soft);color:var(--ink)}
.les.active{background:var(--ink);color:#fff;font-weight:600}

/* reader */
.read{padding:26px 0 90px;min-width:0}
@media(min-width:960px){.read{padding:44px 0 120px}}
.crumb{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);position:relative;display:inline-block;margin-bottom:22px}
.crumb:after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:3px;border-radius:3px;background:linear-gradient(90deg,#b9a2ff,#8fc9ff 48%,#ffb98c)}
.read h1{font-size:clamp(27px,6vw,42px);line-height:1.08;font-weight:900;letter-spacing:-.04em;max-width:20ch}
.read h2{font-size:20px;font-weight:900;letter-spacing:-.03em;margin:34px 0 12px}
.read p{color:var(--ink2);font-size:16.5px;line-height:1.66;margin-top:14px;max-width:70ch}
.read ul{margin:14px 0 0;padding:0;list-style:none;max-width:70ch}
.read ul li{position:relative;padding-left:24px;color:var(--ink2);font-size:16px;line-height:1.6;margin-top:10px}
.read ul li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:2px;background:var(--vio)}
.read pre{
  margin-top:18px;background:var(--soft);border:1px solid var(--line);border-radius:14px;
  padding:16px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.6;color:var(--ink)
}
.note{margin-top:20px;padding:16px 18px;border-radius:14px;background:var(--soft);border-left:3px solid var(--vio);font-size:15px;line-height:1.55;color:var(--ink2);max-width:70ch}
.note b{color:var(--ink)}
.navrow{display:flex;gap:10px;margin-top:44px;flex-wrap:wrap}
.navrow .btn{flex:1;min-width:150px}
.scrim{position:fixed;inset:0;background:rgba(11,11,12,.35);z-index:34;display:none}
.scrim.on{display:block}
@media(min-width:960px){.scrim{display:none!important}}
</style>
</head>
<body>

<!-- ============ GATE ============ -->
<section class="gate" id="gate">
  <div class="field"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="veil"></div></div>
  <div class="gate-card">
    <div class="mark"><i></i></div>
    <h1 id="gTitle">Sign in to your course</h1>
    <p id="gText">Enter the email you used when you bought. We send a one-time link, no password to remember.</p>
    <input type="email" id="email" placeholder="you@email.com" autocomplete="email" inputmode="email">
    <button class="btn btn-block" id="sendBtn">Send me the link</button>
    <div class="msg" id="msg"></div>
    <div class="gate-foot">
      Do not have access yet? <a href="index.html#pricing">Get the course</a> or <a href="https://x.com/hanakoxbt" target="_blank" rel="noopener">message me on X</a>.
    </div>
  </div>
</section>

<!-- ============ APP ============ -->
<div class="app" id="app">
  <div class="topbar">
    <div class="topbar-in">
      <button class="menu-btn" id="menuBtn" aria-label="Menu"><span></span></button>
      <div class="brand"><span class="bdot"></span><span class="bname">Agent Engineering</span></div>
      <div class="who" id="who"></div>
      <button class="lo" id="logout">Log out</button>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>

  <div class="shell">
    <aside class="side" id="side">
      <div class="side-h">the five layers</div>
      <div id="toc"></div>
    </aside>

    <main class="read">
      <div class="crumb" id="crumb"></div>
      <div id="content"></div>
      <div class="navrow">
        <button class="btn btn-line" id="prevBtn">Previous</button>
        <button class="btn" id="nextBtn">Next lesson</button>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   1. PASTE YOUR SUPABASE KEYS HERE
   Supabase dashboard -> Project Settings -> API
   ========================================================= */
const SUPABASE_URL  = "https://YOUR-PROJECT.supabase.co";
const SUPABASE_ANON  = "YOUR-ANON-PUBLIC-KEY";

let sb=null;
try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON); }catch(e){ console.warn("Supabase not configured yet"); }

/* =========================================================
   2. COURSE CONTENT
   Each layer has lessons. Write plain HTML in `body`.
   ========================================================= */
const COURSE = [
 {layer:"Layer 1 - Prompt engineering", color:"#c9b8ff", lessons:[
   {t:"What this layer actually controls",
    body:`<h1>The message is one variable, not the system</h1>
    <p>Prompt engineering is the only layer most people ever touch, which is why it carries blame for failures that live somewhere else. This lesson draws the line: what a prompt can fix, and what it can never fix no matter how it is worded.</p>
    <h2>What belongs here</h2>
    <ul><li>The role the model is asked to take</li><li>Constraints and what is explicitly out of scope</li><li>The definition of done, written so it can be checked</li><li>The shape of the output, so the next step can parse it</li></ul>
    <div class="note"><b>Rule of thumb:</b> if rewording the sentence a third time did not change the failure, the problem is not on this layer. Stop and go up one.</div>`},
   {t:"The four parts of a working prompt",
    body:`<h1>Role, constraints, done, shape</h1>
    <p>Fill this in and most of the guessing disappears.</p>
    <pre>ROLE: you are ...
CONSTRAINTS: never ... always ...
DONE: the task is complete when ...
OUTPUT: return ... and nothing else</pre>
    <p>Write your own version for one task you run often, then run it five times and compare the outputs. Variation between runs tells you which part is still underspecified.</p>`},
 ]},
 {layer:"Layer 2 - Context engineering", color:"#a9dcff", lessons:[
   {t:"What the model sees, and in what order",
    body:`<h1>The window is a budget, not a bucket</h1>
    <p>Everything you put in competes for attention with everything else. This layer is about deciding what earns a place, what gets summarized, and what gets cut first when the window overflows.</p>
    <h2>The three moves</h2>
    <ul><li>Retrieval: pull only what the current step needs</li><li>Compaction: replace history with a summary that keeps the decisions, not the chatter</li><li>Separation: one context per agent, so nobody inherits noise</li></ul>`},
   {t:"Separate contexts, and why they beat one big one",
    body:`<h1>Five agents with clean contexts beat one with all of it</h1>
    <p>When several agents share one context they converge: they read the same things and produce the same answer, and you pay five times for one opinion. Separate contexts are what make parallel work actually parallel.</p>`},
 ]},
 {layer:"Layer 3 - Harness engineering", color:"#bff0dc", lessons:[
   {t:"Everything around the call",
    body:`<h1>The call is the easy part</h1>
    <p>Tools, permissions, parsing, retries, limits and traces are what turn one model call into a unit of work you can rely on. This is the layer where demos and production diverge.</p>
    <h2>The minimum harness</h2>
    <ul><li>A parser that fails loudly instead of guessing</li><li>Retries with a cap, and a different prompt on the retry</li><li>A hard token and time limit per run</li><li>A trace you can read after the fact</li></ul>`},
 ]},
 {layer:"Layer 4 - Loop engineering", color:"#ffcdb0", lessons:[
   {t:"Run, check, correct, run again",
    body:`<h1>A loop is a definition of green</h1>
    <p>Without a check that can fail, a loop is just a repeat. This lesson is about writing the check first: what counts as passing, what goes back, and how many attempts you allow before a human is called.</p>
    <div class="note"><b>The mistake:</b> sending the whole batch back on one failure. Return only the failed unit, and only to the step that produced it.</div>`},
 ]},
 {layer:"Layer 5 - Graph engineering", color:"#0b0b0c", lessons:[
   {t:"Who runs, who waits, who never runs",
    body:`<h1>The shape decides more than the model</h1>
    <p>A graph is the plan of the work: parallel lanes, gates that stop bad output, and back edges that turn today's failures into tomorrow's constraints.</p>
    <h2>Three shapes to copy</h2>
    <ul><li>Six agents from one prompt to a finished PR</li><li>Five searchers into one sourced report</li><li>A codebase audit that ranks findings before anyone reads them</li></ul>`},
   {t:"Back edges and gates",
    body:`<h1>The return path is the whole trick</h1>
    <p>A graph without a back edge is a pipeline: it produces output and forgets. The back edge is what makes accepted results become rules, so the next run starts where this one ended.</p>`},
 ]},
];

/* =========================================================
   3. LOGIC
   ========================================================= */
const $=id=>document.getElementById(id);
let idx={l:0,s:0};

function flat(){const out=[];COURSE.forEach((L,li)=>L.lessons.forEach((s,si)=>out.push({li,si,L,s})));return out;}

function buildToc(){
  const toc=$("toc");toc.innerHTML="";
  COURSE.forEach((L,li)=>{
    const box=document.createElement("div");box.className="lay";
    box.innerHTML=`<div class="lay-t"><i style="background:${L.color}"></i>${L.layer}</div>`;
    L.lessons.forEach((s,si)=>{
      const b=document.createElement("button");
      b.className="les"+(li===idx.l&&si===idx.s?" active":"");
      b.textContent=s.t;
      b.onclick=()=>{idx={l:li,s:si};render();closeSide();};
      box.appendChild(b);
    });
    toc.appendChild(box);
  });
}
function render(){
  const L=COURSE[idx.l],s=L.lessons[idx.s];
  $("crumb").textContent=L.layer;
  $("content").innerHTML=s.body;
  buildToc();
  const f=flat();const pos=f.findIndex(x=>x.li===idx.l&&x.si===idx.s);
  $("prevBtn").disabled=pos<=0;
  $("nextBtn").disabled=pos>=f.length-1;
  $("nextBtn").textContent=pos>=f.length-1?"You are at the end":"Next lesson";
  window.scrollTo({top:0,behavior:"smooth"});
}
$("nextBtn").onclick=()=>{const f=flat();const p=f.findIndex(x=>x.li===idx.l&&x.si===idx.s);if(p<f.length-1){idx={l:f[p+1].li,s:f[p+1].si};render();}};
$("prevBtn").onclick=()=>{const f=flat();const p=f.findIndex(x=>x.li===idx.l&&x.si===idx.s);if(p>0){idx={l:f[p-1].li,s:f[p-1].si};render();}};

function openSide(){$("side").classList.add("open");$("scrim").classList.add("on");}
function closeSide(){$("side").classList.remove("open");$("scrim").classList.remove("on");}
$("menuBtn").onclick=()=>$("side").classList.contains("open")?closeSide():openSide();
$("scrim").onclick=closeSide;

function say(text,kind){const m=$("msg");m.textContent=text;m.className="msg show "+kind;}

$("sendBtn").onclick=async()=>{
  if(!sb){say("Supabase keys are not set in this file yet.","err");return;}
  const email=$("email").value.trim().toLowerCase();
  if(!email||!email.includes("@")){say("Enter a valid email address.","err");return;}
  $("sendBtn").disabled=true;$("sendBtn").textContent="Sending...";
  try{
    const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:window.location.href}});
    if(error)throw error;
    say("Link sent. Open it from this device and you are in.","ok");
  }catch(e){say("Could not send the link. Try again, or message me on X.","err");}
  $("sendBtn").disabled=false;$("sendBtn").textContent="Send me the link";
};

$("logout").onclick=async()=>{if(sb)await sb.auth.signOut();location.reload();};

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return;
  const email=(session.user.email||"").toLowerCase();
  const {data,error}=await sb.from("access_list").select("email").eq("email",email).maybeSingle();
  if(error||!data){
    $("gTitle").textContent="Signed in, but no access yet";
    $("gText").textContent="This email is not on the access list. If you have already paid, send me the transaction hash or screenshot and I will open it.";
    $("email").style.display="none";$("sendBtn").style.display="none";
    say("Signed in as "+email,"err");
    return;
  }
  $("who").textContent=email;
  $("gate").style.display="none";
  $("app").classList.add("on");
  render();
}
if(location.hash==="#demo"){
  document.getElementById("who").textContent="demo@preview";
  document.getElementById("gate").style.display="none";
  document.getElementById("app").classList.add("on");
  render();
}else if(sb){ boot(); }
</script>
</body>
</html>
